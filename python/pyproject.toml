[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-cardmarket"
version = "0.1.0"
description = "Crawlora Cardmarket API client with 5 endpoints for game and catalogue discovery, product lookup, and price guides"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "cardmarket", "cardmarket-api", "cardmarket-scraper", "cardmarket-data", "cardmarket-game-catalogue-discovery", "cardmarket-product-lookup", "cardmarket-price-guides"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=cardmarket-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=cardmarket-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-cardmarket"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_cardmarket"]

[tool.setuptools.package-data]
"crawlora_cardmarket" = ["py.typed", "*.pyi"]
